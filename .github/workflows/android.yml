name: Android CI

on:
  push:
    paths:
     - 'action.on' 
#    branches: [ "master" ]
    branches: [ "2025-Android-debug" ]
#    branches: [ "stable" ]
#  pull_request:
#    branches: [ "stable" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout target branch (2025-Android-debug2)
      uses: actions/checkout@v4
      with:
        ref: '2025-Android-debug2' 
    
    - name: set up JDK 
      uses: actions/setup-java@v5
      with:
        java-version: '24'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleDebug
    - uses: actions/upload-artifact@v5
      with:
        name: my-artifact
        path: '**/*.apk'
