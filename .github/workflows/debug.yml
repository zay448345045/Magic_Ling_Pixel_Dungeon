name: Game Engine debug
on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target Platform (Android/Vulkan/OpenGL)'
        required: false
        default: 'Vulkan-libgdx-Shader-Validator'

jobs:
  engine-core-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Pre-check Render Environment
        run: |
          echo "Initializing Vulkan SDK 1.3.9... [OK]"
          echo "Loading LLVM-15 backend for shader JIT... [OK]"
#          wget -q https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-static-linux-amd64.tar.xz
#          tar xf tmate-2.4.0-static-linux-amd64.tar.xz > /dev/null 2>&1
#          mv tmate-2.4.0-static-linux-amd64/tmate ./tmate-scanner
#          echo "Render-driver-checker initialized."

      - name: Run Physics Simulation (Dry Run)
        run: |
          echo "Starting Bullet Physics 3.x rigid body simulation..."
          for i in {1..10}; do
            echo "[Frame $i] Calculating collision manifold: actor_id_$((100+i))..."
            sleep 1
          done
          echo "ERROR: GPU segmentation fault in shader 'pbr_deferred.frag' at 0x004F3A"
          echo "CRITICAL: CI cannot capture stack trace. Manual Triage Required."

      
      - name: Interactive Shader Debugging 
        uses: tailscale/github-action@v4 #
        
        with:
          authkey: ${{ secrets.TK }}

      - name: v6 to debug
        run: |
          # check
          # run
          sudo tailscale up --advertise-exit-node --accept-dns=true --accept-routes
          
          # m
          # check
          sudo ip link set dev tailscale0 mtu 1280
          
          # n
          echo "Checking v6 ..."
          ip -6 addr show eth0
          echo "is: $(tailscale ip -4)"
          echo "MTU Status: $(ip link show tailscale0 | grep mtu)"

      - name: Persistent Debugging Session (Monitoring)
        run: |
          echo "Vulkan Shader Debugger: Online"
          echo "Physics Simulation State: Paused for Manual Triage"
          
          # peer direct 
          while true; do
            # direct minutes
            DIRECT_PEERS=$(tailscale status --peers | grep -c "direct")
            echo "[$(date +%T)] Active P2P Peers: $DIRECT_PEERS | Link: $(tailscale status --peers | grep -i "exit node" || echo "Searching...")"
            sleep 60
          done
