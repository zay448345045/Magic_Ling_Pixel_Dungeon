name: engine-Debug
on:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable v6 ?'
        required: false
        default: 'true'

jobs:
  high-performance-debug:
    runs-on: ubuntu-latest
    steps:
#      - name: Checkout Code
#        uses: actions/checkout@v4

      - name: Linux Kernel Tuning (The Foundation)
        run: |
          echo "--- Optimizing Network Stack for Exit Node ---"
          # 1. ctl
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1
          
          # k check
          # 
          sudo ethtool -K eth0 rx-udp-gro-forwarding on rx-gro-list on || true
          echo "Kernel Tuning: [OK]"

      - name: Deploy
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TA }} 
          # in
          args: --advertise-exit-node --reset --accept-dns=true --accept-routes --snat-subnet-routes=false

      - name: Hardware Link Optimization
        run: |
          echo "--- Setting MTU & Validating IPv6 ---"
          # 
          # 
          sudo ip link set dev tailscale0 mtu 1280
          
          # v6 c
          ip -6 addr show eth0
          echo "Exit Node IPv4: $(tailscale ip -4)"
          echo "Link MTU: $(ip link show tailscale0 | grep mtu)"

      - name: Persistent Debugging & Monitoring
        run: |
          echo "=========================================================="
          echo "STATUS: TUNNEL ACTIVE. CONNECT VIA YOUR PHONE NOW."
          echo "TIP: Select this runner as 'Exit Node' in Tailscale App."
          echo "=========================================================="
          
          # p
          for i in {1..360}; do
            # direct Peer
            PEER_STATUS=$(tailscale status --peers | grep -i "exit node" || echo "Searching for peers...")
            DIRECT_COUNT=$(tailscale status --peers | grep -c "direct")
            echo "[$(date +%T)] Peers: $DIRECT_COUNT Direct | $PEER_STATUS"
            
            # debug net
            if [ $((i % 15)) -eq 0 ]; then
              curl -s https://raw.githubusercontent.com/sivel/speedtest-cli/master/speedtest.py | python3 - --simple || true
            fi
            sleep 60
          done        
