name: engine-Debug
on:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable IPv6 Turbo?'
        required: false
        default: 'true'

jobs:
  high-performance-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Linux Kernel Tuning
        run: |
          echo "--- 正在开启内核转发与网络优化 ---"
          # 1. 开启内核转发（解决能连上但没网的根本原因）
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1
          
          # 2. 优化 UDP 吞吐量（解决 GRO 转发警告，压榨万兆带宽）
          sudo ethtool -K eth0 rx-udp-gro-forwarding on rx-gro-list on || true
          echo "内核优化完成 [OK]"

      - name: Install & Auth Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          # 注意：这里故意不写任何 args，防止与下面的手动命令冲突

      - name: Manual Tailscale Up & Exit Node Config
        run: |
          echo "--- 正在强制启动出口节点模式 ---"
          # 使用 --reset 强行覆盖插件的默认参数，避免 "flag provided multiple times" 报错
          sudo tailscale up \
            --advertise-exit-node \
            --reset \
            --accept-dns=true \
            --accept-routes \
            --snat-subnet-routes=false
          
          # 关键：强制设置 MTU 为 1280，解决“能 Ping 通但进不去网页”的玄学问题
          sudo ip link set dev tailscale0 mtu 1280
          
          echo "出口节点已就绪！"
          echo "虚拟网卡状态："
          ip addr show tailscale0

      - name: Hardware Link Check
        run: |
          echo "--- 链路诊断 ---"
          ip -6 addr show eth0
          echo "当前公网 IPv4: $(curl -s ifconfig.me)"
          echo "Tailscale 内网 IP: $(tailscale ip -4)"

      - name: Persistent Debugging & Monitoring
        run: |
          echo "=========================================================="
          echo "："
          echo " 1. 找到设备 '...' "
          echo " 2. 点击并勾选 'Use Exit Node' "
          echo "=========================================================="
          
          # 持续保活并监控 P2P 直连状态
          for i in {1..360}; do
            PEER_STATUS=$(tailscale status --peers | grep -i "exit node" || echo "等待手机连接...")
            DIRECT_COUNT=$(tailscale status --peers | grep -c "direct")
            echo "[$(date +%T)] 状态: $DIRECT_COUNT 个直连节点 | $PEER_STATUS"
            
            # 每 15 分钟模拟一次流量，防止连接挂起
            if [ $((i % 15)) -eq 0 ]; then
               curl -s https://www.google.com/generate_204 > /dev/null || true
            fi
            sleep 60
          done
